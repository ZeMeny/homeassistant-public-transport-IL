[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# pythonpath makes custom_components importable. The asyncio settings match
# pytest-asyncio 0.24, which pytest-homeassistant-custom-component==0.13.205
# installs.
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
