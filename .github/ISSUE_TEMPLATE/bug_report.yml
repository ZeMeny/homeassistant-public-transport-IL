name: Bug report
description: Report a problem with this integration
labels: ["bug"]
body:
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: false
  - type: textarea
    id: versions
    attributes:
      label: Home Assistant version and integration version
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs
    validations:
      required: false
